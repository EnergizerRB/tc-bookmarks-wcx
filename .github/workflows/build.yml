yaml
name: Build TC Firefox places.sqlite WCX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download SQLite Amalgamation
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sqlite.org" -OutFile "sqlite.zip"
          Expand-Archive -Path "sqlite.zip" -DestinationPath "sqlite_src"
          Copy-Item "sqlite_src\sqlite-amalgamation-3470200\sqlite3.c" -Destination "."
          Copy-Item "sqlite_src\sqlite-amalgamation-3470200\sqlite3.h" -Destination "."

      - name: Decode source and compile places_wcx.wcx64
        shell: pwsh
        run: |
          $b64 = @"


"@
$clean = $b64 -replace '\s', ''
::WriteAllBytes("places_wcx.cpp", ::FromBase64String($clean))
gcc -O2 -c sqlite3.c -o sqlite3.o
g++ -shared -O2 -std=c++17 -o places_wcx.wcx64 places_wcx.cpp sqlite3.o -static -static-libgcc -static-libstdc++ -Wl,--kill-at
- name: Upload WCX Plugin Artifact
uses: actions/upload-artifact@v4
with:
name: places-wcx64-plugin
path: places_wcx.wcx64
