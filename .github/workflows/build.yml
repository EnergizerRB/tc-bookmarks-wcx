name: Build places_wcx.wcx64

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 64-bit WCX plugin
    runs-on: windows-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install MinGW-w64 g++ toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
          path-type: inherit

      - name: Download SQLite amalgamation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $urls = @(
            'https://www.sqlite.org/2024/sqlite-amalgamation-3460100.zip',
            'https://www.sqlite.org/2023/sqlite-amalgamation-3430200.zip'
          )
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url"
              Invoke-WebRequest -Uri $url -OutFile sqlite-amalgamation.zip -UseBasicParsing
              $downloaded = $true
              break
            } catch {
              Write-Host "Failed: $($_.Exception.Message)"
            }
          }
          if (-not $downloaded) { throw 'Could not download the SQLite amalgamation' }

          Expand-Archive -Path sqlite-amalgamation.zip -DestinationPath sqlite-src -Force
          $c = Get-ChildItem -Path sqlite-src -Recurse -Filter sqlite3.c | Select-Object -First 1
          $h = Get-ChildItem -Path sqlite-src -Recurse -Filter sqlite3.h | Select-Object -First 1
          Copy-Item $c.FullName ./sqlite3.c -Force
          Copy-Item $h.FullName ./sqlite3.h -Force
          Get-Item ./sqlite3.c, ./sqlite3.h | Select-Object Name, Length

      - name: Compile SQLite amalgamation
        shell: msys2 {0}
        run: |
          gcc -c sqlite3.c -o sqlite3.o -O2 -I. \
            -DSQLITE_THREADSAFE=0 \
            -DSQLITE_OMIT_LOAD_EXTENSION \
            -DSQLITE_OMIT_DEPRECATED \
            -DSQLITE_DEFAULT_MEMSTATUS=0

      - name: Compile WCX plugin
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra \
            -DUNICODE -D_UNICODE \
            -shared -o places_wcx.wcx64 places_wcx.cpp sqlite3.o -I. \
            -static -static-libgcc -static-libstdc++ \
            -Wl,--kill-at

      - name: Verify exported WCX entry points
        shell: msys2 {0}
        run: |
          objdump -p places_wcx.wcx64 | grep -E 'CanYouHandleThisFileW|CloseArchive|GetPackerCaps|OpenArchiveW|ProcessFileW|ReadHeaderExW|SetChangeVolProcW|SetProcessDataProcW'
          test -f places_wcx.wcx64
          ls -l places_wcx.wcx64

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v5
        with:
          name: places_wcx.wcx64
          path: places_wcx.wcx64
          if-no-files-found: error
