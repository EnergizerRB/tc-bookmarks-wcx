name: Build places_wcx.wcx64

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WCX plugin
    runs-on: windows-latest
    env:
      SQLITE_DEFS: >-
        -DSQLITE_THREADSAFE=0
        -DSQLITE_OMIT_LOAD_EXTENSION
        -DSQLITE_OMIT_DEPRECATED
        -DSQLITE_DEFAULT_MEMSTATUS=0

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install MinGW-w64 g++ toolchains
        uses: msys2/setup-msys2@v2
        with:
          # MINGW64 links against the OS msvcrt.dll, so the plugin also loads on
          # Windows versions without the Universal CRT (UCRT64 would require it).
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
          path-type: inherit

      - name: Install 32-bit MinGW-w64 toolchain
        shell: msys2 {0}
        run: |
          set -e
          pacman -S --noconfirm --needed mingw-w64-i686-gcc
          /mingw32/bin/gcc --version | head -1
          /mingw32/bin/g++ --version | head -1

      - name: Download SQLite amalgamation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $urls = @(
            'https://www.sqlite.org/2024/sqlite-amalgamation-3460100.zip',
            'https://www.sqlite.org/2023/sqlite-amalgamation-3430200.zip'
          )
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url"
              Invoke-WebRequest -Uri $url -OutFile sqlite-amalgamation.zip -UseBasicParsing
              $downloaded = $true
              break
            } catch {
              Write-Host "Failed: $($_.Exception.Message)"
            }
          }
          if (-not $downloaded) { throw 'Could not download the SQLite amalgamation' }

          Expand-Archive -Path sqlite-amalgamation.zip -DestinationPath sqlite-src -Force
          $c = Get-ChildItem -Path sqlite-src -Recurse -Filter sqlite3.c | Select-Object -First 1
          $h = Get-ChildItem -Path sqlite-src -Recurse -Filter sqlite3.h | Select-Object -First 1
          Copy-Item $c.FullName ./sqlite3.c -Force
          Copy-Item $h.FullName ./sqlite3.h -Force
          Get-Item ./sqlite3.c, ./sqlite3.h | Select-Object Name, Length

      - name: Compile SQLite amalgamation
        shell: msys2 {0}
        run: |
          set -e
          exec 2>&1
          echo "== x86_64 =="
          gcc -c sqlite3.c -o sqlite3-x64.o -O2 -I. $SQLITE_DEFS
          echo "== i686 =="
          /mingw32/bin/gcc -c sqlite3.c -o sqlite3-x86.o -O2 -I. $SQLITE_DEFS
          ls -l sqlite3-x64.o sqlite3-x86.o

      - name: Compile WCX plugin
        shell: msys2 {0}
        run: |
          set -e
          echo "== x86_64 =="
          g++ -std=c++17 -O2 -Wall -Wextra -DUNICODE -D_UNICODE \
            -shared -o places_wcx.wcx64 places_wcx.cpp sqlite3-x64.o -I. \
            -static -static-libgcc -static-libstdc++ -Wl,--kill-at
          echo "== i686 =="
          /mingw32/bin/g++ -std=c++17 -O2 -Wall -Wextra -DUNICODE -D_UNICODE \
            -shared -o places_wcx.wcx places_wcx.cpp sqlite3-x86.o -I. \
            -static -static-libgcc -static-libstdc++ -Wl,--kill-at
          ls -l places_wcx.wcx64 places_wcx.wcx

      - name: Verify exported WCX entry points
        shell: msys2 {0}
        run: |
          set -e
          for pair in "places_wcx.wcx64:objdump" "places_wcx.wcx:/mingw32/bin/objdump"; do
            file="${pair%%:*}"
            tool="${pair##*:}"
            echo "== $file =="
            test -f "$file"
            $tool -p "$file" | grep -E 'CanYouHandleThisFileW|CloseArchive|GetPackerCaps|OpenArchiveW|ProcessFileW|ReadHeaderExW|SetChangeVolProcW|SetProcessDataProcW'
            $tool -p "$file" | grep 'DLL Name'
            ls -l "$file"
          done

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: places_wcx
          path: |
            places_wcx.wcx64
            places_wcx.wcx
          if-no-files-found: error
